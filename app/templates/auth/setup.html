{% extends "base.html" %}
{% block title %}Create Admin — The Crucible{% endblock %}
{% block content %}
<div style="max-width:420px;margin:4rem auto">
  <div class="card">
    <h2 style="margin-top:0;text-align:center">🔧 The Crucible</h2>
    <h3 style="text-align:center;color:#555;font-weight:normal;margin-top:0">First-Run Setup</h3>
    <p style="color:#666;font-size:.9rem;text-align:center">Create your admin account to get started.</p>

    {% if errors %}
    <ul class="errors">{% for e in errors %}<li>{{ e }}</li>{% endfor %}</ul>
    {% endif %}

    <form method="post">
      <div style="margin-bottom:1rem">
        <label style="display:block;margin-bottom:.3rem;font-weight:600">Username</label>
        <input name="username" type="text" value="{{ username }}" autocomplete="username" autofocus required
               style="width:100%;padding:.5rem;border:1px solid #ccc;border-radius:4px;box-sizing:border-box">
      </div>
      <div style="margin-bottom:1rem">
        <label style="display:block;margin-bottom:.3rem;font-weight:600">Password <span style="color:#999;font-weight:normal">(min 8 chars)</span></label>
        <input name="password" type="password" autocomplete="new-password" required
               style="width:100%;padding:.5rem;border:1px solid #ccc;border-radius:4px;box-sizing:border-box">
      </div>
      <div style="margin-bottom:1.25rem">
        <label style="display:block;margin-bottom:.3rem;font-weight:600">Confirm Password</label>
        <input name="confirm" type="password" autocomplete="new-password" required
               style="width:100%;padding:.5rem;border:1px solid #ccc;border-radius:4px;box-sizing:border-box">
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;padding:.6rem">Create Account</button>
    </form>
  </div>
</div>
{% endblock %}
