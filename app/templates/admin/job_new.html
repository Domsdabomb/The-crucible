{% extends "base.html" %}
{% block title %}New Job — The Crucible{% endblock %}
{% block content %}
<h2>New Job Intake</h2>

{% if errors %}
<div class="errors"><ul>{% for e in errors %}<li>{{ e }}</li>{% endfor %}</ul></div>
{% endif %}

<form method="post" action="/admin/jobs/new">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem">

    <!-- Customer -->
    <div class="card" style="grid-column:1/-1">
      <h3 style="margin-top:0">Customer</h3>
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:.75rem">
        <div>
          <label>Name *</label>
          <input type="text" name="customer_name" value="{{ form.customer_name if form else '' }}" required style="width:100%">
        </div>
        <div>
          <label>Phone * <small style="color:#666">(E.164, e.g. +12505550100)</small></label>
          <input type="tel" name="customer_phone" value="{{ form.customer_phone if form else '' }}" placeholder="+1XXXXXXXXXX" required style="width:100%">
        </div>
        <div>
          <label>Email</label>
          <input type="email" name="customer_email" value="{{ form.customer_email if form else '' }}" style="width:100%">
        </div>
      </div>
    </div>

    <!-- Device -->
    <div class="card" style="grid-column:1/-1">
      <h3 style="margin-top:0">Device</h3>
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:.75rem">
        <div>
          <label>Make *</label>
          <input type="text" name="device_make" value="{{ form.device_make if form else '' }}" placeholder="Apple, Samsung…" required style="width:100%">
        </div>
        <div>
          <label>Model *</label>
          <input type="text" name="device_model" value="{{ form.device_model if form else '' }}" placeholder="iPhone 15, Galaxy S24…" required style="width:100%">
        </div>
        <div>
          <label>Serial / IMEI</label>
          <input type="text" name="device_serial" value="{{ form.device_serial if form else '' }}" style="width:100%">
        </div>
        <div>
          <label>Passcode <small style="color:#666">(stored encrypted)</small></label>
          <input type="text" name="device_passcode" value="{{ form.device_passcode if form else '' }}" style="width:100%">
        </div>
        <div style="grid-column:2/-1">
          <label>Condition Notes</label>
          <input type="text" name="device_condition" value="{{ form.device_condition if form else '' }}" placeholder="Cracked screen, no physical damage…" style="width:100%">
        </div>
      </div>
    </div>

    <!-- Job -->
    <div class="card" style="grid-column:1/-1">
      <h3 style="margin-top:0">Job Details</h3>
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:.75rem">
        <div>
          <label>Priority</label>
          <select name="priority" style="width:100%">
            {% for p in priorities %}
            <option value="{{ p }}" {% if (form.priority if form else 'normal') == p %}selected{% endif %}>{{ p }}</option>
            {% endfor %}
          </select>
        </div>
        <div>
          <label>Technician</label>
          <select name="technician_id" style="width:100%">
            <option value="">— Unassigned —</option>
            {% for t in technicians %}
            <option value="{{ t.id }}">{{ t.name }}</option>
            {% endfor %}
          </select>
        </div>
        <div>
          <label>Promised Date</label>
          <input type="date" name="promised_date" value="{{ form.promised_date if form else '' }}" style="width:100%">
        </div>
        <div>
          <label>Quoted Amount (cents)</label>
          <input type="number" name="quoted_cents" value="{{ form.quoted_cents if form else '0' }}" min="0" style="width:100%">
        </div>
        <div style="grid-column:2/-1">
          <label>Description / Complaint</label>
          <input type="text" name="description" value="{{ form.description if form else '' }}" placeholder="Customer describes the problem…" style="width:100%">
        </div>
      </div>
    </div>

  </div>

  <div style="margin-top:.5rem">
    <button type="submit" class="btn btn-primary" style="font-size:1rem;padding:.5rem 1.5rem">Create Job &amp; Send Intake SMS</button>
    <a href="/admin/" class="btn btn-secondary" style="margin-left:.5rem">Cancel</a>
  </div>
</form>
{% endblock %}
