name: Build Android APK

on:
  push:
    tags: ['app-v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Restore binary files
        working-directory: mobile
        run: |
          base64 -d android/gradle/wrapper/gradle-wrapper.jar.b64 > android/gradle/wrapper/gradle-wrapper.jar
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            base64 -d android/app/src/main/res/mipmap-$d/ic_launcher.png.b64 > android/app/src/main/res/mipmap-$d/ic_launcher.png
          done

      - name: Analyze and build
        working-directory: mobile
        run: |
          flutter pub get
          flutter analyze
          flutter build apk --release

      - name: Release APK
        uses: softprops/action-gh-release@v2
        with:
          files: mobile/build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
